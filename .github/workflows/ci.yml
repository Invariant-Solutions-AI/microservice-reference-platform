name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d orders"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Check formatting
        run: make format-check
      - name: Check license headers
        run: make license-check
      - name: Check module tidiness
        env:
          GOWORK: "off"
        run: |
          for module in shared/observability shared/service services/edge services/orders; do
            go -C "$module" mod tidy -diff
          done
      - name: Check workspace synchronization
        run: |
          go work sync
          changes=$(git status --porcelain --untracked-files=all -- go.work go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum')
          if [ -n "$changes" ]; then
            echo "Workspace is out of sync:"
            echo "$changes"
            git --no-pager diff -- go.work go.work.sum ':(glob)**/go.mod' ':(glob)**/go.sum'
            exit 1
          fi
      - name: Build
        run: make build
      - name: Unit tests
        run: make test
      - name: Race tests
        run: make test-race
      - name: PostgreSQL integration tests
        env:
          ORDERS_TEST_DATABASE_URL: postgres://orders:local-development-only@localhost:5432/orders?sslmode=disable
        run: go -C services/orders test -count=1 ./cmd ./internal/persistence/postgres ./internal/server
      - name: Vet
        run: make vet
